name: Bug report
description: Report reproducible OmniCleaner behavior that does not match expectations.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OmniCleaner. Do not include private files, secrets, or sensitive paths.
  - type: input
    id: version
    attributes:
      label: OmniCleaner version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [x64, ARM64, Unknown]
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options: [Overview, Cleanup & privacy, Storage & files, Apps & Windows, Automation, History & recovery, Settings & safety, Rule Lab, Installer or uninstaller]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the expected behavior and what occurred instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Analyze…"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted screenshots or non-sensitive details if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed personal information, secrets, and sensitive paths.
          required: true
        - label: This is not a security vulnerability; security issues will be reported privately.
          required: true
